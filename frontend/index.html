<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevSearch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <div class="header">
        <h1>DevSearch</h1>

        <button id="logout-btn">
            Logout
        </button>
    </div>


    <form id="search-form">

        <input
                type="text"
                id="search-input"
                placeholder="Search..."
                autocomplete="off"
        >

        <button type="submit">
            Search
        </button>

    </form>


    <div id="results"></div>

</main>


<script src="script.js"></script>

</body>

</html>
